<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Happy Birthday Allura!!</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="stage">
      <div class="edge left" aria-hidden="true"></div>
      <div class="edge right" aria-hidden="true"></div>

      <button class="cta">CLICK ME</button>

      <div class="overlay" id="overlay" aria-hidden="true">
        <div class="top-particles" id="topParticles" aria-hidden="true"></div>
        <div class="overlay-content">
          <div class="message">
            <div class="small">HAPPY</div>
            <h1>Birthday</h1>
            <div class="small">TO YOU ALLURABELS</div>
          </div>

          <div class="cake-wrap" id="cakeWrap" aria-hidden="true">
            <!-- Replaced SVG: three-tier cake styled like sample, recolored gold & black -->
            <svg id="cakeSvg" viewBox="0 -40 420 360" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <defs>
                <linearGradient id="goldTop" x1="0" x2="0" y1="0" y2="1">
                  <stop offset="0%" stop-color="#fff6d6" />
                  <stop offset="60%" stop-color="#f6d27a" />
                  <stop offset="100%" stop-color="#c99a36" />
                </linearGradient>
                <radialGradient id="flameGrad" cx="40%" cy="30%" r="60%">
                  <stop offset="0%" stop-color="#fff8e6" />
                  <stop offset="40%" stop-color="#ffd27a" />
                  <stop offset="100%" stop-color="#f1a61a" />
                </radialGradient>
              </defs>

              <!-- soft shadow -->
              <ellipse cx="210" cy="295" rx="150" ry="16" fill="#000" opacity="0.45" />

              <!-- bottom tier -->
              <g id="tier3" transform="translate(20,160)">
                <rect x="0" y="30" width="380" height="90" rx="18" fill="#080808" stroke="#0b0b0b" stroke-width="6" />
                <rect x="0" y="0" width="380" height="44" rx="16" fill="url(#goldTop)" stroke="#a67c2a" stroke-width="4" />
                <path d="M18 46 C50 38 82 58 120 46 C158 34 190 64 228 46 C266 28 298 58 342 46 C366 40 370 46 370 46" fill="none" stroke="#a67c2a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
                <!-- decorative dots -->
                <g fill="#c89e2b" stroke="#050505" stroke-width="3">
                  <circle cx="32" cy="90" r="6" />
                  <circle cx="76" cy="90" r="6" />
                  <circle cx="120" cy="90" r="6" />
                  <circle cx="164" cy="90" r="6" />
                  <circle cx="208" cy="90" r="6" />
                  <circle cx="252" cy="90" r="6" />
                  <circle cx="296" cy="90" r="6" />
                  <circle cx="340" cy="90" r="6" />
                </g>
              </g>

              <!-- middle tier -->
              <g id="tier2" transform="translate(60,92)">
                <rect x="0" y="30" width="300" height="78" rx="16" fill="#080808" stroke="#0b0b0b" stroke-width="5" />
                <rect x="0" y="0" width="300" height="38" rx="14" fill="url(#goldTop)" stroke="#a67c2a" stroke-width="3" />
                <path d="M12 42 C42 34 74 56 110 42 C146 28 178 58 212 42 C246 26 278 56 288 42" fill="none" stroke="#a67c2a" stroke-width="5" stroke-linecap="round" />
                <g fill="#c89e2b" stroke="#050505" stroke-width="2">
                  <circle cx="24" cy="68" r="5" />
                  <circle cx="64" cy="68" r="5" />
                  <circle cx="104" cy="68" r="5" />
                  <circle cx="144" cy="68" r="5" />
                  <circle cx="184" cy="68" r="5" />
                  <circle cx="224" cy="68" r="5" />
                </g>
              </g>

              <!-- top tier -->
              <g id="tier1" transform="translate(120,28)">
                <rect x="0" y="30" width="180" height="64" rx="12" fill="#080808" stroke="#0b0b0b" stroke-width="4" />
                <rect x="0" y="0" width="180" height="34" rx="12" fill="url(#goldTop)" stroke="#a67c2a" stroke-width="3" />
                <path d="M8 36 C36 30 68 50 92 36 C116 22 148 52 172 36" fill="none" stroke="#a67c2a" stroke-width="4" stroke-linecap="round" />
                <g fill="#c89e2b" stroke="#050505" stroke-width="2">
                  <circle cx="20" cy="56" r="4" />
                  <circle cx="56" cy="56" r="4" />
                  <circle cx="92" cy="56" r="4" />
                  <circle cx="128" cy="56" r="4" />
                </g>
                <!-- single candle centered -->
                <g transform="translate(90,-12)">
                  <rect x="-6" y="-18" width="12" height="40" rx="3" fill="#0b0b0b" />
                  <rect x="-4" y="-16" width="8" height="36" rx="2" fill="#d6a96b" opacity="0.95" />
                  <path class="flame" d="M0,-26 C6,-38 14,-38 12,-26 C10,-16 0,-6 0,-6 C0,-6 -10,-16 -12,-26 C-10,-38 -6,-38 0,-26 Z" fill="url(#flameGrad)" />
                </g>
              </g>

            </svg>
            <div class="blow-hint" id="micHint">Wish, then blow into your mic to extinguish</div>
          </div>

          <button class="close" id="closeOverlay" aria-label="Close">Close</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
